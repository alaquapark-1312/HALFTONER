<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALFTONER PRO+</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Azeret+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #090907;
  --s1:    #111110;
  --s2:    #1a1916;
  --s3:    #262420;
  --s4:    #322e28;
  --acc:   #e8c84a;
  --acc2:  #d43020;
  --txt:   #ccc7b8;
  --muted: #5a5650;
  --white: #ede9df;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Azeret Mono',monospace;
  background:var(--bg);color:var(--txt);
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-size:12px;
}

/* ── TOPBAR ───────────────────────────────────── */
#topbar{
  display:flex;align-items:center;gap:7px;
  padding:0 12px;height:46px;
  border-bottom:1px solid var(--s3);flex-shrink:0;
  background:var(--s1);
}
.logo{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:19px;letter-spacing:.18em;color:var(--acc);
  margin-right:2px;white-space:nowrap;
}
.logo em{color:var(--acc2);font-style:normal;}
.logo small{font-size:10px;color:var(--muted);letter-spacing:.25em;margin-left:3px;}
.topbar-sep{flex:1;}
.tb-btn{
  display:flex;align-items:center;gap:4px;
  padding:5px 9px;
  background:var(--s2);border:1px solid var(--s3);border-radius:2px;
  color:var(--txt);cursor:pointer;
  font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:.06em;
  transition:border-color .12s,color .12s;white-space:nowrap;
}
.tb-btn:hover{border-color:var(--acc);color:var(--acc);}
.tb-btn.active{border-color:var(--acc);color:var(--acc);}
.tb-btn.hot{border-color:var(--acc2);color:var(--acc2);}
.tb-btn.hot:hover{border-color:var(--acc2);color:#ff5540;}
.tb-btn.live{border-color:var(--acc2);color:var(--acc2);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.tb-btn:disabled{opacity:.35;cursor:default;}

.lang-switcher{display:flex;border:1px solid var(--s3);border-radius:2px;overflow:hidden;}
.lang-btn{
  padding:5px 7px;background:var(--s2);border:none;border-right:1px solid var(--s3);
  color:var(--muted);cursor:pointer;
  font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.08em;
  transition:background .12s,color .12s;
}
.lang-btn:last-child{border-right:none;}
.lang-btn:hover{color:var(--txt);}
.lang-btn.active{background:var(--s3);color:var(--acc);}

.exp-wrap{position:relative;}
.exp-btn{
  padding:5px 11px;background:var(--acc);border:none;border-radius:2px;
  color:var(--bg);cursor:pointer;
  font-family:'Azeret Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;
  white-space:nowrap;
}
.exp-btn:hover{background:#f0d45e;}
.exp-menu{
  position:absolute;top:calc(100% + 4px);right:0;
  background:var(--s2);border:1px solid var(--s3);border-radius:2px;
  overflow:hidden;display:none;z-index:200;min-width:220px;
}
.exp-menu.open{display:block;}
.exp-item{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:8px 14px;cursor:pointer;font-size:10px;letter-spacing:.06em;color:var(--txt);
}
.exp-item:hover{background:var(--s3);color:var(--acc);}
.exp-tag{font-size:9px;color:var(--muted);}
.exp-div{height:1px;background:var(--s3);}

/* ── WORKSPACE ────────────────────────────────── */
#workspace{display:flex;flex:1;overflow:hidden;}

#canvas-area{
  flex:1;position:relative;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:grab;
}
#canvas-area.panning{cursor:grabbing;}
#canvas-area.drag-over{outline:2px solid var(--acc);outline-offset:-3px;}
#glCanvas{
  max-width:100%;max-height:100%;display:block;
  image-rendering:pixelated;
  transform-origin:center center;
}
#drop-overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;pointer-events:none;transition:opacity .2s;z-index:10;
}
#drop-overlay.hidden{opacity:0;}
.drop-icon{
  width:72px;height:72px;border:1px dashed var(--s4);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted);
}
.drop-label{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:22px;letter-spacing:.12em;color:var(--muted);
}
.drop-sub{font-size:10px;color:var(--muted);letter-spacing:.06em;text-align:center;line-height:1.6;}
.drop-actions{display:flex;gap:8px;pointer-events:all;}
.drop-click{
  margin-top:4px;padding:6px 16px;
  background:var(--s2);border:1px solid var(--s3);border-radius:2px;
  color:var(--muted);font-size:10px;letter-spacing:.07em;cursor:pointer;
  transition:border-color .12s,color .12s;
}
.drop-click:hover{border-color:var(--acc);color:var(--acc);}
#split-line{
  position:absolute;top:0;width:1px;height:100%;
  background:var(--acc);pointer-events:none;display:none;z-index:5;
}
#zoom-hud{
  position:absolute;bottom:10px;left:10px;
  font-size:9px;color:var(--muted);letter-spacing:.08em;
  background:rgba(9,9,7,.7);padding:3px 8px;border-radius:2px;z-index:6;
}

/* ── VIDEO BAR ────────────────────────────────── */
#video-bar{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:10px;
  background:rgba(9,9,7,.88);border:1px solid var(--s3);border-radius:3px;
  padding:7px 12px;z-index:8;min-width:420px;
}
#video-bar.on{display:flex;}
.vb-btn{
  background:var(--s2);border:1px solid var(--s3);border-radius:2px;
  color:var(--txt);cursor:pointer;padding:4px 9px;
  font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:.05em;
  transition:all .12s;white-space:nowrap;
}
.vb-btn:hover{border-color:var(--acc);color:var(--acc);}
.vb-btn.rec{border-color:var(--acc2);color:var(--acc2);}
.vb-btn.rec.recording{background:var(--acc2);color:var(--bg);animation:pulse 1s infinite;}
#vbScrub{flex:1;min-width:180px;}
#vbTime{font-size:9px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* ── SIDEBAR ──────────────────────────────────── */
#sidebar{
  width:290px;flex-shrink:0;border-left:1px solid var(--s3);
  display:flex;flex-direction:column;background:var(--s1);overflow:hidden;
}
#effect-tabs{display:flex;border-bottom:1px solid var(--s3);flex-shrink:0;background:var(--bg);}
.eff-tab{
  flex:1;padding:9px 1px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:11px;letter-spacing:.04em;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;
  transition:color .12s,border-color .12s;
}
.eff-tab:hover{color:var(--txt);}
.eff-tab.active{color:var(--acc);border-bottom-color:var(--acc);}

#ctrl-scroll{
  flex:1;overflow-y:auto;padding:12px 14px 20px;
  display:flex;flex-direction:column;gap:16px;
}
#ctrl-scroll::-webkit-scrollbar{width:3px;}
#ctrl-scroll::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px;}

.ctrl-section{display:flex;flex-direction:column;gap:9px;}
.ctrl-section-hd{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:10px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;border-bottom:1px solid var(--s3);
  padding-bottom:5px;margin-bottom:2px;
  display:flex;justify-content:space-between;align-items:center;
}
.hd-reset{
  cursor:pointer;color:var(--muted);font-size:9px;letter-spacing:.05em;
  font-family:'Azeret Mono',monospace;font-weight:400;
}
.hd-reset:hover{color:var(--acc2);}

.ctrl-row{display:flex;flex-direction:column;gap:4px;}
.ctrl-lrow{display:flex;justify-content:space-between;align-items:center;}
.ctrl-label{font-size:9px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;}
.ctrl-val{font-size:9px;color:var(--acc);font-variant-numeric:tabular-nums;}

input[type="range"]{
  -webkit-appearance:none;width:100%;height:2px;
  background:var(--s3);border-radius:1px;outline:none;cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;
  background:var(--acc);border-radius:50%;cursor:pointer;transition:transform .1s;
}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.4);}

.ctrl-toggle-row{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.toggle-track{
  width:30px;height:15px;background:var(--s3);border-radius:8px;
  position:relative;transition:background .15s;flex-shrink:0;
}
.toggle-track.on{background:var(--acc);}
.toggle-thumb{
  position:absolute;width:11px;height:11px;background:var(--bg);
  border-radius:50%;top:2px;left:2px;transition:left .15s;
}
.toggle-track.on .toggle-thumb{left:17px;}

.shape-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.shape-btn{
  padding:3px 8px;background:var(--s2);border:1px solid var(--s3);border-radius:2px;
  color:var(--txt);cursor:pointer;
  font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:.03em;transition:all .1s;
}
.shape-btn:hover{border-color:var(--txt);}
.shape-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(232,200,74,.07);}

.color-row{display:flex;align-items:center;gap:8px;}
.color-swatch{
  width:22px;height:22px;border-radius:2px;border:1px solid var(--s3);
  cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;
}
.color-swatch input[type="color"]{
  position:absolute;inset:-4px;width:200%;height:200%;border:none;cursor:pointer;opacity:0;
}

.preset-bar{display:flex;gap:5px;}
select.preset-sel{
  flex:1;background:var(--s2);border:1px solid var(--s3);border-radius:2px;
  color:var(--txt);font-family:'Azeret Mono',monospace;font-size:9px;
  padding:5px 6px;outline:none;cursor:pointer;letter-spacing:.04em;min-width:0;
}
select.preset-sel:hover{border-color:var(--acc);}
.mini-btn{
  padding:5px 8px;background:var(--s2);border:1px solid var(--s3);border-radius:2px;
  color:var(--muted);cursor:pointer;font-size:9px;font-family:'Azeret Mono',monospace;
  letter-spacing:.04em;white-space:nowrap;transition:all .1s;
}
.mini-btn:hover{border-color:var(--acc);color:var(--acc);}
.mini-row{display:flex;gap:5px;}

#histo{width:100%;height:52px;background:var(--bg);border:1px solid var(--s3);border-radius:2px;}

#info-bar{
  border-top:1px solid var(--s3);padding:7px 14px;
  font-size:9px;color:var(--muted);letter-spacing:.05em;
  display:flex;justify-content:space-between;flex-shrink:0;gap:8px;
}
#info-bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.spinner{
  position:fixed;bottom:16px;right:302px;
  font-size:9px;color:var(--acc);letter-spacing:.1em;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;
  background:rgba(9,9,7,.85);padding:4px 10px;border-radius:2px;
}
.spinner.on{opacity:1;}

#toast{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);
  background:var(--s2);border:1px solid var(--acc);border-radius:2px;
  padding:6px 14px;font-size:10px;color:var(--acc);letter-spacing:.06em;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:400;
}
#toast.on{opacity:1;}

#kbd-hint{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:8px;color:var(--muted);letter-spacing:.06em;opacity:.5;pointer-events:none;
}
</style>
</head>
<body>
<input type="file" id="fileInput" accept="image/*,video/mp4,video/webm,video/quicktime" style="display:none">
<input type="file" id="presetInput" accept=".json" style="display:none">
<input type="file" id="svgShapeInput" accept=".svg,image/svg+xml" style="display:none">

<div id="topbar">
  <div class="logo">HALF<em>T</em>ONER<small>PRO+</small></div>
  <div class="topbar-sep"></div>

  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="eu">EU</button>
    <button class="lang-btn" data-lang="es">ES</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <button class="tb-btn" id="undoBtn" title="Ctrl+Z">↶</button>
  <button class="tb-btn" id="redoBtn" title="Ctrl+Y">↷</button>
  <button class="tb-btn" id="uploadBtn">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M5 1L8 4H6v4H4V4H2L5 1z"/><rect x="1" y="8" width="8" height="1.2"/></svg>
    <span data-t="upload"></span>
  </button>
  <button class="tb-btn" id="webcamBtn">◉ <span id="webcamLbl" data-t="webcam"></span></button>
  <button class="tb-btn hot" id="autoBtn">✦ <span data-t="auto"></span></button>
  <button class="tb-btn" id="randBtn">⚄ <span data-t="random"></span></button>
  <button class="tb-btn" id="fitBtn">⛶</button>
  <button class="tb-btn" id="fsBtn">⤢</button>
  <button class="tb-btn" id="splitBtn">◧ <span data-t="split"></span></button>
  <div class="exp-wrap">
    <button class="exp-btn" id="expBtn">↓ <span data-t="export"></span> ▾</button>
    <div class="exp-menu" id="expMenu">
      <div class="exp-item" data-act="png">PNG 1× <span class="exp-tag" data-t="exp_png_tag"></span></div>
      <div class="exp-item" data-act="png2">PNG 2× <span class="exp-tag">HD</span></div>
      <div class="exp-item" data-act="png4">PNG 4× <span class="exp-tag">ULTRA HD</span></div>
      <div class="exp-item" data-act="svg">SVG <span class="exp-tag" data-t="exp_svg_tag"></span></div>
      <div class="exp-item" data-act="cmyk">CMYK SVG <span class="exp-tag" data-t="exp_cmyk_tag"></span></div>
      <div class="exp-div"></div>
      <div class="exp-item" data-act="copy"><span data-t="exp_copy"></span> <span class="exp-tag">clipboard</span></div>
      <div class="exp-item" data-act="link"><span data-t="exp_link"></span> <span class="exp-tag">URL</span></div>
    </div>
  </div>
</div>

<div id="workspace">
  <div id="canvas-area">
    <canvas id="glCanvas"></canvas>
    <div id="drop-overlay">
      <div class="drop-icon">🖼</div>
      <div class="drop-label" data-t="drop_title"></div>
      <div class="drop-sub" data-t="drop_sub"></div>
      <div class="drop-actions">
        <div class="drop-click" id="dropClick" data-t="drop_btn"></div>
        <div class="drop-click" id="dropCam">◉ <span data-t="webcam"></span></div>
      </div>
    </div>
    <div id="split-line"></div>
    <div id="zoom-hud">100%</div>
    <div id="video-bar">
      <button class="vb-btn" id="vbPlay">⏸</button>
      <input type="range" id="vbScrub" min="0" max="1000" value="0" step="1">
      <span id="vbTime">0:00 / 0:00</span>
      <button class="vb-btn rec" id="vbRec">⏺ REC</button>
    </div>
  </div>

  <div id="sidebar">
    <div id="effect-tabs">
      <div class="eff-tab active" data-eff="dots">DOTS</div>
      <div class="eff-tab" data-eff="cmyk">CMYK</div>
      <div class="eff-tab" data-eff="linear" data-t-tab="tab_linear"></div>
      <div class="eff-tab" data-eff="shapes" data-t-tab="tab_shapes"></div>
      <div class="eff-tab" data-eff="riso">RISO</div>
      <div class="eff-tab" data-eff="dither">DTHR</div>
    </div>
    <div id="ctrl-scroll"></div>
    <div id="info-bar">
      <span id="info-size">— × —</span>
      <span id="info-lpi"></span>
      <span id="info-eff"></span>
    </div>
  </div>
</div>

<div class="spinner" id="spinner"><span data-t="processing"></span></div>
<div id="toast"></div>
<div id="kbd-hint">1-6 FX · S split · F fit · E png · A auto · R rand · Ctrl+Z/Y</div>

let currentLang='eu';
function t(k){return LANGS[currentLang][k]||k;}

function applyLang(){
  document.documentElement.lang=currentLang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-t-tab]').forEach(el=>{el.textContent=t(el.dataset.tTab);});
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.lang===currentLang);
  });
  if(liveActive) document.getElementById('webcamLbl').textContent=t('capture');
  buildControls(state.effect);
  document.getElementById('info-eff').textContent=t('eff_'+state.effect);

function toast(key){
  const el=document.getElementById('toast');
  el.textContent=t(key);
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('on'),1800);
}

const VS=`attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.,1.);}`;

const FS_DOTS=`
precision highp float;
uniform sampler2D u_img;uniform vec2 u_res;
uniform float u_cell,u_angle,u_gamma,u_inv,u_splitX;
uniform vec3 u_ink,u_paper;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 uv=vec2(fc.x,u_res.y-fc.y)/u_res;
  if(fc.x<u_splitX){gl_FragColor=vec4(texture2D(u_img,uv).rgb,1.);return;}
  float ca=cos(u_angle),sa=sin(u_angle);
  vec2 rfc=vec2(ca*fc.x-sa*fc.y,sa*fc.x+ca*fc.y);
  vec2 ccr=(floor(rfc/u_cell)+.5)*u_cell;
  vec2 ccw=vec2(ca*ccr.x+sa*ccr.y,-sa*ccr.x+ca*ccr.y);
  vec2 suv=clamp(ccw/u_res,0.,1.);suv.y=1.-suv.y;
  float l=luma(texture2D(u_img,suv).rgb);
  if(u_inv>.5)l=1.-l;
  l=pow(clamp(l,.001,1.),u_gamma);
  float r=l*u_cell*.5*.96;
  float m=1.-smoothstep(r-.8,r+.8,length(rfc-ccr));
  gl_FragColor=vec4(mix(u_paper,u_ink,m),1.);
}`;

const FS_CMYK=`
precision highp float;
uniform sampler2D u_img;uniform vec2 u_res;
uniform float u_cell,u_dg,u_splitX;
uniform float u_aC,u_aM,u_aY,u_aK;
void getCMYK(vec3 rgb,out float c,out float m,out float y,out float k){
  k=1.-max(max(rgb.r,rgb.g),rgb.b);
  float d=max(1.-k,.001);
  c=clamp((1.-rgb.r-k)/d,0.,1.);
  m=clamp((1.-rgb.g-k)/d,0.,1.);
  y=clamp((1.-rgb.b-k)/d,0.,1.);
  k=clamp(k,0.,1.);
}
vec2 cellSample(vec2 fc,float angle,float sz){
  float ca=cos(angle),sa=sin(angle);
  vec2 rfc=vec2(ca*fc.x-sa*fc.y,sa*fc.x+ca*fc.y);
  vec2 ccr=(floor(rfc/sz)+.5)*sz;
  vec2 ccw=vec2(ca*ccr.x+sa*ccr.y,-sa*ccr.x+ca*ccr.y);
  vec2 suv=clamp(ccw/u_res,0.,1.);suv.y=1.-suv.y;
  return suv;
}
float dotMask(vec2 fc,float angle,float sz,float val){
  float ca=cos(angle),sa=sin(angle);
  vec2 rfc=vec2(ca*fc.x-sa*fc.y,sa*fc.x+ca*fc.y);
  vec2 ccr=(floor(rfc/sz)+.5)*sz;
  float r=clamp(val,0.,1.)*sz*.5*.96;
  return 1.-smoothstep(r-.8,r+.8,length(rfc-ccr));
}
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 uv=vec2(fc.x,u_res.y-fc.y)/u_res;
  if(fc.x<u_splitX){gl_FragColor=texture2D(u_img,uv);return;}
  float cC,mC,yC,kC;
  getCMYK(texture2D(u_img,cellSample(fc,u_aC,u_cell)).rgb,cC,mC,yC,kC);
  cC+=u_dg*cC*(1.-cC);
  float cM,mM,yM,kM;
  getCMYK(texture2D(u_img,cellSample(fc,u_aM,u_cell)).rgb,cM,mM,yM,kM);
  mM+=u_dg*mM*(1.-mM);
  float cY,mY,yY,kY;
  getCMYK(texture2D(u_img,cellSample(fc,u_aY,u_cell)).rgb,cY,mY,yY,kY);
  yY+=u_dg*yY*(1.-yY);
  float cK,mK,yK,kK;
  getCMYK(texture2D(u_img,cellSample(fc,u_aK,u_cell)).rgb,cK,mK,yK,kK);
  kK+=u_dg*kK*(1.-kK);
  float dC=dotMask(fc,u_aC,u_cell,cC);
  float dM=dotMask(fc,u_aM,u_cell,mM);
  float dY=dotMask(fc,u_aY,u_cell,yY);
  float dK=dotMask(fc,u_aK,u_cell,kK);
  vec3 res=vec3(1.);
  res=mix(res,res*vec3(0.,1.,1.),dC);
  res=mix(res,res*vec3(1.,0.,1.),dM);
  res=mix(res,res*vec3(1.,1.,0.),dY);
  res=mix(res,vec3(0.),dK);
  gl_FragColor=vec4(res,1.);
}`;

const FS_LINEAR=`
precision highp float;
uniform sampler2D u_img;uniform vec2 u_res;
uniform float u_cell,u_angle,u_angle2,u_cross,u_splitX;
uniform vec3 u_ink,u_paper;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
float linePass(vec2 fc,float angle,float sz){
  float ca=cos(angle),sa=sin(angle);
  vec2 rfc=vec2(ca*fc.x-sa*fc.y,sa*fc.x+ca*fc.y);
  float rowCy=(floor(rfc.y/sz)+.5)*sz;
  vec2 sr=vec2(rfc.x,rowCy);
  vec2 sw=vec2(ca*sr.x+sa*sr.y,-sa*sr.x+ca*sr.y);
  vec2 suv=clamp(sw/u_res,0.,1.);suv.y=1.-suv.y;
  float l=luma(texture2D(u_img,suv).rgb);
  float hw=l*sz*.5*.96;
  return 1.-smoothstep(hw-.8,hw+.8,abs(rfc.y-rowCy));
}
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 uv=vec2(fc.x,u_res.y-fc.y)/u_res;
  if(fc.x<u_splitX){gl_FragColor=vec4(texture2D(u_img,uv).rgb,1.);return;}
  float m=linePass(fc,u_angle,u_cell);
  if(u_cross>.5)m=max(m,linePass(fc,u_angle2,u_cell));
  gl_FragColor=vec4(mix(u_paper,u_ink,m),1.);
}`;

const FS_SHAPES=`
precision highp float;
uniform sampler2D u_img;uniform sampler2D u_stamp;uniform vec2 u_res;
uniform float u_cell,u_angle,u_shape,u_splitX;
uniform vec3 u_ink,u_paper;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
float sdfHex(vec2 p){p=abs(p);return max(dot(p,normalize(vec2(1.,1.73205))),p.x)-1.;}
float sdfCross(vec2 p){p=abs(p);float w=.38;return min(max(p.x-1.,p.y-w),max(p.y-1.,p.x-w));}
float sdfDia(vec2 p){p=abs(p);return(p.x+p.y)-1.;}
float sdfStar(vec2 p){
  float an=.6283185,bn=mod(atan(p.y,p.x),2.*an)-an;
  p=length(p)*vec2(cos(bn),abs(sin(bn)));
  p-=vec2(.951,.309);
  p.y+=clamp(-p.y,0.,.226);
  return length(p)*sign(p.x);
}
float sdfSquare(vec2 p){p=abs(p);return max(p.x,p.y)-1.;}
float sdfTri(vec2 p){
  const float k=1.73205;
  p.x=abs(p.x)-1.;p.y=p.y+1./k;
  if(p.x+k*p.y>0.)p=vec2(p.x-k*p.y,-k*p.x-p.y)/2.;
  p.x-=clamp(p.x,-2.,0.);
  return -length(p)*sign(p.y);
}
float sdfRing(vec2 p){return abs(length(p)-.7)-.3;}
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 uv=vec2(fc.x,u_res.y-fc.y)/u_res;
  if(fc.x<u_splitX){gl_FragColor=vec4(texture2D(u_img,uv).rgb,1.);return;}
  float ca=cos(u_angle),sa=sin(u_angle);
  vec2 rfc=vec2(ca*fc.x-sa*fc.y,sa*fc.x+ca*fc.y);
  vec2 ccr=(floor(rfc/u_cell)+.5)*u_cell;
  vec2 ccw=vec2(ca*ccr.x+sa*ccr.y,-sa*ccr.x+ca*ccr.y);
  vec2 suv=clamp(ccw/u_res,0.,1.);suv.y=1.-suv.y;
  float l=luma(texture2D(u_img,suv).rgb);
  float sc=max(l*u_cell*.5*.96,.01);
  vec2 ln=(rfc-ccr)/sc;
  if(u_shape>6.5){
    float inside=step(abs(ln.x),1.)*step(abs(ln.y),1.);
    vec2 tuv=vec2(ln.x*.5+.5,.5-ln.y*.5);
    vec4 st=texture2D(u_stamp,tuv);
    float a=st.a*inside;
    gl_FragColor=vec4(mix(u_paper,st.rgb,a),1.);
    return;
  }
  float aa=1.5/sc;
  float sdf;
  if(u_shape<.5)      sdf=sdfHex(ln);
  else if(u_shape<1.5)sdf=sdfCross(ln);
  else if(u_shape<2.5)sdf=sdfDia(ln);
  else if(u_shape<3.5)sdf=sdfStar(ln);
  else if(u_shape<4.5)sdf=sdfSquare(ln);
  else if(u_shape<5.5)sdf=sdfTri(ln);
  else                sdf=sdfRing(ln);
  float m=1.-smoothstep(-aa,aa,sdf);
  gl_FragColor=vec4(mix(u_paper,u_ink,m),1.);
}`;

const FS_RISO=`
precision highp float;
uniform sampler2D u_img;uniform vec2 u_res;
uniform float u_cell,u_nc,u_mr,u_grain,u_splitX;
uniform vec3 u_c1,u_c2,u_c3;
const float PI=3.14159265;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hdot(vec2 fc,float angle,float sz,float inv){
  float ca=cos(angle),sa=sin(angle);
  vec2 rfc=vec2(ca*fc.x-sa*fc.y,sa*fc.x+ca*fc.y);
  vec2 ccr=(floor(rfc/sz)+.5)*sz;
  vec2 ccw=vec2(ca*ccr.x+sa*ccr.y,-sa*ccr.x+ca*ccr.y);
  vec2 suv=clamp(ccw/u_res,0.,1.);suv.y=1.-suv.y;
  float l=luma(texture2D(u_img,suv).rgb);
  if(inv>.5)l=1.-l;
  float r=l*sz*.5*.96;
  return 1.-smoothstep(r-.8,r+.8,length(rfc-ccr));
}
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 uv=vec2(fc.x,u_res.y-fc.y)/u_res;
  if(fc.x<u_splitX){gl_FragColor=vec4(texture2D(u_img,uv).rgb,1.);return;}
  float d1=hdot(fc+vec2(u_mr*.7,u_mr*.4),45.*PI/180.,u_cell,0.);
  float d2=hdot(fc-vec2(u_mr*.5,u_mr*.6),75.*PI/180.,u_cell,1.);
  vec3 res=vec3(1.);
  res*=mix(vec3(1.),u_c1,d1);
  res*=mix(vec3(1.),u_c2,d2);
  if(u_nc>2.5){
    float d3=hdot(fc+vec2(-u_mr*.3,u_mr*.8),15.*PI/180.,u_cell*.85,0.);
    res*=mix(vec3(1.),u_c3,d3*.75);
  }
  float g=(hash(floor(fc))-0.5)*u_grain*.18;
  res=clamp(res+g,0.,1.);
  gl_FragColor=vec4(res,1.);
}`;

const FS_DITHER=`
precision highp float;
uniform sampler2D u_img;uniform vec2 u_res;
uniform float u_px,u_mat,u_bias,u_inv,u_splitX;
uniform vec3 u_ink,u_paper;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
float B2(vec2 a){a=floor(a);return fract(a.x/2.+a.y*a.y*.75);}
float B4(vec2 a){return B2(.5*a)*.25+B2(a);}
float B8(vec2 a){return B4(.5*a)*.25+B2(a);}
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 uv=vec2(fc.x,u_res.y-fc.y)/u_res;
  if(fc.x<u_splitX){gl_FragColor=vec4(texture2D(u_img,uv).rgb,1.);return;}
  float iy=u_res.y-fc.y;
  vec2 cell=floor(vec2(fc.x,iy)/u_px);
  vec2 suv=clamp((cell+.5)*u_px/u_res,0.,1.);
  float l=luma(texture2D(u_img,suv).rgb);
  if(u_inv>.5)l=1.-l;
  float th;
  if(u_mat<2.5)      th=B2(cell);
  else if(u_mat<4.5) th=B4(cell);
  else               th=B8(cell);
  float m=l<th+u_bias?1.:0.;
  gl_FragColor=vec4(mix(u_paper,u_ink,m),1.);
}`;

    params:{pixelSize:3,matrix:8,bias:0,invert:false,inkColor:'#0a0a0a',paperColor:'#f8f6ef'},
    adjust:{brightness:2,contrast:42,saturation:-100,blur:0,black:14,white:240,posterize:0}},
};

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const state={
  effect:'dots', imageLoaded:false,
  splitActive:false, splitX:-1,
  zoom:1, panX:0, panY:0,
  adjust:{brightness:0,contrast:0,saturation:0,blur:0,black:0,white:255,posterize:0},
  customSVG:null,
  params:{}
};
const _EFF0=getEFF();
for(const[eid,edef]of Object.entries(_EFF0)){
  state.params[eid]={};
  for(const c of edef.ctrls) state.params[eid][c.id]=c.def;
}
const ADJ_DEF={brightness:0,contrast:0,saturation:0,blur:0,black:0,white:255,posterize:0};

const srcCanvas=document.createElement('canvas');
const procCanvas=document.createElement('canvas');

// Webcam
let liveActive=false,liveVideo=null,liveStream=null,liveRAF=null;
// Video file
let videoMode=false,videoEl=null,videoRAF=null,videoURL=null;
// Recorder
let recorder=null,recChunks=[],recWasLoop=true;

// ═══════════════════════════════════════════════════════════
//  WEBGL
// ═══════════════════════════════════════════════════════════
const canvas=document.getElementById('glCanvas');
const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});

function compileShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));gl.deleteShader(s);return null;}
  return s;
}
function makeProgram(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compileShader(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compileShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));return null;}
  return p;
}
const progs={
  dots:makeProgram(VS,FS_DOTS), cmyk:makeProgram(VS,FS_CMYK),
  linear:makeProgram(VS,FS_LINEAR), shapes:makeProgram(VS,FS_SHAPES),
  riso:makeProgram(VS,FS_RISO), dither:makeProgram(VS,FS_DITHER),
};
const quadBuf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

// Stamp texture for custom SVG shape (unit 1)
const stampTex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,stampTex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));

function u(p,n){return gl.getUniformLocation(p,n);}
function hexRGB(h){
  const n=parseInt(h.slice(1),16);
  return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
}

function render(){
  if(!state.imageLoaded) return;
  const prog=progs[state.effect];
  const p=state.params[state.effect];
  const W=canvas.width,H=canvas.height;
  gl.viewport(0,0,W,H);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  const aPos=gl.getAttribLocation(prog,'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.uniform1i(u(prog,'u_img'),0);
  gl.uniform2f(u(prog,'u_res'),W,H);
  gl.uniform1f(u(prog,'u_splitX'),state.splitActive?state.splitX:-1);
  const D2R=Math.PI/180;
  const eff=state.effect;
  if(eff==='dots'){
    gl.uniform1f(u(prog,'u_cell'),p.cellSize);
    gl.uniform1f(u(prog,'u_angle'),p.angle*D2R);
    gl.uniform1f(u(prog,'u_gamma'),p.gamma);
    gl.uniform1f(u(prog,'u_inv'),p.invert?1:0);
    gl.uniform3fv(u(prog,'u_ink'),hexRGB(p.inkColor));
    gl.uniform3fv(u(prog,'u_paper'),hexRGB(p.paperColor));
  }else if(eff==='cmyk'){
    gl.uniform1f(u(prog,'u_cell'),p.cellSize);
    gl.uniform1f(u(prog,'u_dg'),p.dotGain);
    gl.uniform1f(u(prog,'u_aC'),p.angC*D2R);
    gl.uniform1f(u(prog,'u_aM'),p.angM*D2R);
    gl.uniform1f(u(prog,'u_aY'),p.angY*D2R);
    gl.uniform1f(u(prog,'u_aK'),p.angK*D2R);
  }else if(eff==='linear'){
    gl.uniform1f(u(prog,'u_cell'),p.cellSize);
    gl.uniform1f(u(prog,'u_angle'),p.angle*D2R);
    gl.uniform1f(u(prog,'u_angle2'),p.angle2*D2R);
    gl.uniform1f(u(prog,'u_cross'),p.crosshatch?1:0);
    gl.uniform3fv(u(prog,'u_ink'),hexRGB(p.inkColor));
    gl.uniform3fv(u(prog,'u_paper'),hexRGB(p.paperColor));
  }else if(eff==='shapes'){
    gl.uniform1f(u(prog,'u_cell'),p.cellSize);
    gl.uniform1f(u(prog,'u_angle'),p.angle*D2R);
    gl.uniform1f(u(prog,'u_shape'),p.shape==='custom'?7:SHAPE_LIST.indexOf(p.shape));
    gl.uniform3fv(u(prog,'u_ink'),hexRGB(p.inkColor));
    gl.uniform3fv(u(prog,'u_paper'),hexRGB(p.paperColor));
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D,stampTex);
    gl.uniform1i(u(prog,'u_stamp'),1);
    gl.activeTexture(gl.TEXTURE0);
  }else if(eff==='riso'){
    gl.uniform1f(u(prog,'u_cell'),p.cellSize);
    gl.uniform1f(u(prog,'u_nc'),p.numColors);
    gl.uniform1f(u(prog,'u_mr'),p.misreg);
    gl.uniform1f(u(prog,'u_grain'),p.grain);
    gl.uniform3fv(u(prog,'u_c1'),hexRGB(p.color1));
    gl.uniform3fv(u(prog,'u_c2'),hexRGB(p.color2));
    gl.uniform3fv(u(prog,'u_c3'),hexRGB(p.color3));
  }else if(eff==='dither'){
    gl.uniform1f(u(prog,'u_px'),p.pixelSize);
    gl.uniform1f(u(prog,'u_mat'),p.matrix);
    gl.uniform1f(u(prog,'u_bias'),p.bias);
    gl.uniform1f(u(prog,'u_inv'),p.invert?1:0);
    gl.uniform3fv(u(prog,'u_ink'),hexRGB(p.inkColor));
    gl.uniform3fv(u(prog,'u_paper'),hexRGB(p.paperColor));
  }
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  updateInfoLPI();
}

// ═══════════════════════════════════════════════════════════
//  IMAGE PIPELINE
// ═══════════════════════════════════════════════════════════
function buildLUT(a){
  const bp=a.black,wp=Math.max(bp+5,a.white);
  const lut=new Uint8Array(256);
  for(let i=0;i<256;i++){
    let v=(i-bp)/(wp-bp);
    v=Math.max(0,Math.min(1,v));
    if(a.posterize>=2){const n=a.posterize;v=Math.round(v*(n-1))/(n-1);}
    lut[i]=Math.round(v*255);
  }
  return lut;
}
function lutActive(a){return a.black>0||a.white<255||a.posterize>=2;}

function drawProcessed(source,w,h){
  procCanvas.width=w;procCanvas.height=h;
  const ctx=procCanvas.getContext('2d',{willReadFrequently:true});
  const a=state.adjust;
  ctx.filter=`brightness(${100+a.brightness}%) contrast(${100+a.contrast}%) saturate(${Math.max(0,100+a.saturation)}%) blur(${a.blur}px)`;
  ctx.drawImage(source,0,0,w,h);
  ctx.filter='none';
  if(lutActive(a)){
    const id=ctx.getImageData(0,0,w,h);
    const d=id.data,lut=buildLUT(a);
    for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]];}
    ctx.putImageData(id,0,0);
  }
}

function applyAdjust(){
  if(!state.imageLoaded||liveActive||videoMode) return;
  drawProcessed(srcCanvas,srcCanvas.width,srcCanvas.height);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,procCanvas);
  drawHistogram();
  render();
}

let adjustRAF=null;
function requestAdjust(){
  if(adjustRAF) return;
  adjustRAF=requestAnimationFrame(()=>{adjustRAF=null;(liveActive||videoMode)?null:applyAdjust();});
}

function loadImage(img){
  if(liveActive) stopWebcam(false);
  if(videoMode) stopVideo();
  const MAX=2048;
  let w=img.naturalWidth,h=img.naturalHeight;
  if(w>MAX||h>MAX){const sc=MAX/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc);}
  srcCanvas.width=w;srcCanvas.height=h;
  srcCanvas.getContext('2d').drawImage(img,0,0,w,h);
  canvas.width=w;canvas.height=h;
  state.imageLoaded=true;
  state.zoom=1;state.panX=0;state.panY=0;applyTransform();
  document.getElementById('drop-overlay').classList.add('hidden');
  document.getElementById('info-size').textContent=`${w} × ${h} px`;
  applyAdjust();
}

// ── Transforms (flip/rotate) ─────────────────────
function transformSrc(op){
  if(!state.imageLoaded||liveActive||videoMode) return;
  const w=srcCanvas.width,h=srcCanvas.height;
  const tmp=document.createElement('canvas');
  const c=tmp.getContext('2d');
  if(op==='rot'){
    tmp.width=h;tmp.height=w;
    c.translate(h/2,w/2);c.rotate(Math.PI/2);c.drawImage(srcCanvas,-w/2,-h/2);
  }else{
    tmp.width=w;tmp.height=h;
    c.translate(op==='fh'?w:0,op==='fv'?h:0);
    c.scale(op==='fh'?-1:1,op==='fv'?-1:1);
    c.drawImage(srcCanvas,0,0);
  }
  srcCanvas.width=tmp.width;srcCanvas.height=tmp.height;
  srcCanvas.getContext('2d').drawImage(tmp,0,0);
  canvas.width=srcCanvas.width;canvas.height=srcCanvas.height;
  document.getElementById('info-size').textContent=`${srcCanvas.width} × ${srcCanvas.height} px`;
  applyAdjust();
}

// ═══════════════════════════════════════════════════════════
//  WEBCAM
// ═══════════════════════════════════════════════════════════
async function toggleWebcam(){
  if(!liveActive){
    if(videoMode) stopVideo();
    try{
      liveStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}}});
    }catch(e){toast('toast_nocam');return;}
    liveVideo=document.createElement('video');
    liveVideo.srcObject=liveStream;
    liveVideo.muted=true;liveVideo.playsInline=true;
    await liveVideo.play();
    const w=liveVideo.videoWidth,h=liveVideo.videoHeight;
    canvas.width=w;canvas.height=h;
    state.imageLoaded=true;
    state.zoom=1;state.panX=0;state.panY=0;applyTransform();
    document.getElementById('drop-overlay').classList.add('hidden');
    document.getElementById('info-size').textContent=`${w} × ${h} · ${t('live')}`;
    liveActive=true;
    const btn=document.getElementById('webcamBtn');
    btn.classList.add('live');
    document.getElementById('webcamLbl').textContent=t('capture');
    liveLoop();
  }else{
    stopWebcam(true);
  }
}
function liveLoop(){
  if(!liveActive) return;
  const w=canvas.width,h=canvas.height;
  drawProcessed(liveVideo,w,h);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,procCanvas);
  render();
  liveRAF=requestAnimationFrame(liveLoop);
}
function stopWebcam(capture){
  if(liveRAF){cancelAnimationFrame(liveRAF);liveRAF=null;}
  if(capture&&liveVideo){
    const w=liveVideo.videoWidth,h=liveVideo.videoHeight;
    srcCanvas.width=w;srcCanvas.height=h;
    srcCanvas.getContext('2d').drawImage(liveVideo,0,0,w,h);
  }
  if(liveStream){liveStream.getTracks().forEach(tr=>tr.stop());liveStream=null;}
  liveVideo=null;liveActive=false;
  const btn=document.getElementById('webcamBtn');
  btn.classList.remove('live');
  document.getElementById('webcamLbl').textContent=t('webcam');
  if(capture){
    document.getElementById('info-size').textContent=`${srcCanvas.width} × ${srcCanvas.height} px`;
    applyAdjust();
    pushHistory();
  }
}

// ═══════════════════════════════════════════════════════════
//  VIDEO FILE MODE
// ═══════════════════════════════════════════════════════════
function fmtTime(s){
  if(!isFinite(s)) s=0;
  const m=Math.floor(s/60),ss=Math.floor(s%60);
  return `${m}:${String(ss).padStart(2,'0')}`;
}

function loadVideo(file){
  if(liveActive) stopWebcam(false);
  if(videoMode) stopVideo();
  videoURL=URL.createObjectURL(file);
  videoEl=document.createElement('video');
  videoEl.src=videoURL;
  videoEl.muted=true;videoEl.playsInline=true;videoEl.loop=true;
  videoEl.addEventListener('loadedmetadata',()=>{
    const MAX=1920;
    let w=videoEl.videoWidth,h=videoEl.videoHeight;
    if(w>MAX||h>MAX){const sc=MAX/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc);}
    canvas.width=w;canvas.height=h;
    state.imageLoaded=true;videoMode=true;
    state.zoom=1;state.panX=0;state.panY=0;applyTransform();
    document.getElementById('drop-overlay').classList.add('hidden');
    document.getElementById('info-size').textContent=`${w} × ${h} · VIDEO`;
    document.getElementById('video-bar').classList.add('on');
    document.getElementById('vbPlay').textContent='⏸';
    videoEl.play();
    videoLoop();
  });
  videoEl.addEventListener('timeupdate',()=>{
    if(!videoMode) return;
    const scrub=document.getElementById('vbScrub');
    if(!scrub.matches(':active')&&videoEl.duration){
      scrub.value=Math.round(videoEl.currentTime/videoEl.duration*1000);
    }
    document.getElementById('vbTime').textContent=
      `${fmtTime(videoEl.currentTime)} / ${fmtTime(videoEl.duration)}`;
  });
}

function videoLoop(){
  if(!videoMode) return;
  drawProcessed(videoEl,canvas.width,canvas.height);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,procCanvas);
  render();
  videoRAF=requestAnimationFrame(videoLoop);
}

function stopVideo(){
  if(recorder){try{recorder.stop();}catch(e){}recorder=null;}
  if(videoRAF){cancelAnimationFrame(videoRAF);videoRAF=null;}
  if(videoEl){videoEl.pause();videoEl.src='';}
  if(videoURL){URL.revokeObjectURL(videoURL);videoURL=null;}
  videoEl=null;videoMode=false;
  document.getElementById('video-bar').classList.remove('on');
  document.getElementById('vbRec').classList.remove('recording');
}

function toggleVideoPlay(){
  if(!videoMode||!videoEl) return;
  if(videoEl.paused){videoEl.play();document.getElementById('vbPlay').textContent='⏸';}
  else{videoEl.pause();document.getElementById('vbPlay').textContent='▶';}
}

document.getElementById('vbPlay').addEventListener('click',toggleVideoPlay);
document.getElementById('vbScrub').addEventListener('input',e=>{
  if(!videoMode||!videoEl||!videoEl.duration) return;
  videoEl.currentTime=e.target.value/1000*videoEl.duration;
});

// ── Record processed output ─────────────────────
function pickRecMime(){
  const cands=[
    'video/mp4;codecs=avc1','video/mp4',
    'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'
  ];
  for(const m of cands){
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}
function toggleRecord(){
  if(!videoMode||!videoEl) return;
  if(recorder){recorder.stop();return;}
  const mime=pickRecMime();
  if(!mime){console.error('MediaRecorder not supported');return;}
  const stream=canvas.captureStream(30);
  try{
    recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14_000_000});
  }catch(e){
    recorder=new MediaRecorder(stream);
  }
  recChunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  recorder.onstop=()=>{
    const ext=(recorder.mimeType||mime).includes('mp4')?'mp4':'webm';
    const blob=new Blob(recChunks,{type:recorder.mimeType||mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`halftoner_video.${ext}`;
    a.click();
    URL.revokeObjectURL(a.href);
    recorder=null;
    document.getElementById('vbRec').classList.remove('recording');
    if(videoEl){videoEl.loop=recWasLoop;videoEl.onended=null;if(videoEl.paused)videoEl.play();}
    document.getElementById('vbPlay').textContent='⏸';
    toast('toast_rec_done');
  };
  // Full-length capture: seek to start, disable loop, auto-stop at end
  recWasLoop=videoEl.loop;
  videoEl.loop=false;
  videoEl.currentTime=0;
  videoEl.onended=()=>{if(recorder)recorder.stop();};
  videoEl.play();
  document.getElementById('vbPlay').textContent='⏸';
  recorder.start(200);
  document.getElementById('vbRec').classList.add('recording');
  toast('toast_rec');
}
document.getElementById('vbRec').addEventListener('click',toggleRecord);

// ═══════════════════════════════════════════════════════════
//  AUTO ANALYSIS
// ═══════════════════════════════════════════════════════════
function autoAnalyze(){
  if(!state.imageLoaded) return;
  const source=liveActive?liveVideo:(videoMode?videoEl:srcCanvas);
  const sw=liveActive?liveVideo.videoWidth:(videoMode?videoEl.videoWidth:srcCanvas.width);
  const sh=liveActive?liveVideo.videoHeight:(videoMode?videoEl.videoHeight:srcCanvas.height);
  const tmp=document.createElement('canvas');
  const S=256,sc=Math.min(1,S/Math.max(sw,sh));
  tmp.width=Math.max(1,Math.round(sw*sc));
  tmp.height=Math.max(1,Math.round(sh*sc));
  const tctx=tmp.getContext('2d');
  tctx.drawImage(source,0,0,tmp.width,tmp.height);
  const d=tctx.getImageData(0,0,tmp.width,tmp.height).data;
  const hist=new Array(256).fill(0);
  const N=tmp.width*tmp.height;
  for(let i=0;i<d.length;i+=4){
    hist[Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])]++;
  }
  let acc=0,p3=0,p97=255;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>=N*.03){p3=i;break;}}
  acc=0;
  for(let i=255;i>=0;i--){acc+=hist[i];if(acc>=N*.03){p97=i;break;}}
  const range=Math.max(20,p97-p3),mid=(p3+p97)/2;
  state.adjust.contrast=Math.round(Math.min(60,Math.max(-20,(225/range-1)*100)));
  state.adjust.brightness=Math.round(Math.min(40,Math.max(-40,(127-mid)/255*100)));
  const minDim=Math.min(canvas.width,canvas.height);
  const autoCell=Math.max(5,Math.min(20,Math.round(minDim/110)));
  if(state.effect==='dither'){
    state.params.dither.pixelSize=Math.max(2,Math.min(8,Math.round(minDim/260)));
  }else{
    state.params[state.effect].cellSize=autoCell;
  }
  state.adjust.blur=autoCell<8&&state.effect!=='dither'?0.4:0;
  buildControls(state.effect);
  applyAdjust();
  pushHistory();
}

// ═══════════════════════════════════════════════════════════
//  RANDOMIZE
// ═══════════════════════════════════════════════════════════
function randHex(){
  const h=Math.random()*360,s=55+Math.random()*40,l=35+Math.random()*30;
  const a=s/100*Math.min(l/100,1-l/100);
  const f=n=>{const k=(n+h/30)%12;const c=l/100-a*Math.max(Math.min(k-3,9-k,1),-1);
    return Math.round(255*c).toString(16).padStart(2,'0');};
  return '#'+f(0)+f(8)+f(4);
}
function randomize(){
  const EFF=getEFF();
  const def=EFF[state.effect];
  const p=state.params[state.effect];
  for(const c of def.ctrls){
    if(c.t==='slider'){
      const r=c.min+Math.random()*(c.max-c.min);
      p[c.id]=Math.round(r/c.step)*c.step;
    }else if(c.t==='toggle'){
      p[c.id]=Math.random()<.35;
    }else if(c.t==='shapes'){
      p[c.id]=c.opts[Math.floor(Math.random()*c.opts.length)];
    }else if(c.t==='opts'){
      p[c.id]=c.opts[Math.floor(Math.random()*c.opts.length)].v;
    }else if(c.t==='color'){
      if(state.effect==='riso'||Math.random()<.4) p[c.id]=randHex();
    }
  }
  // Keep values sane
  if(p.cellSize!==undefined) p.cellSize=Math.max(def.ctrls[0].min,Math.min(24,p.cellSize));
  buildControls(state.effect);
  render();
  pushHistory();
}

// ═══════════════════════════════════════════════════════════
//  HISTOGRAM
// ═══════════════════════════════════════════════════════════
function drawHistogram(){
  const hc=document.getElementById('histo');
  if(!hc||!state.imageLoaded) return;
  const hctx=hc.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const HW=hc.width=hc.clientWidth*dpr;
  const HH=hc.height=52*dpr;
  const tmp=document.createElement('canvas');
  const S=200,sc=Math.min(1,S/Math.max(procCanvas.width||1,procCanvas.height||1));
  tmp.width=Math.max(1,Math.round((procCanvas.width||1)*sc));
  tmp.height=Math.max(1,Math.round((procCanvas.height||1)*sc));
  try{
    tmp.getContext('2d').drawImage(procCanvas,0,0,tmp.width,tmp.height);
    const d=tmp.getContext('2d').getImageData(0,0,tmp.width,tmp.height).data;
    const hist=new Array(64).fill(0);
    for(let i=0;i<d.length;i+=4){
      const l=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255;
      hist[Math.min(63,Math.floor(l*64))]++;
    }
    const mx=Math.max(...hist,1);
    hctx.clearRect(0,0,HW,HH);
    const bw=HW/64;
    hctx.fillStyle='#e8c84a';
    for(let i=0;i<64;i++){
      const h=(hist[i]/mx)*(HH-4);
      hctx.globalAlpha=.35+.65*(hist[i]/mx);
      hctx.fillRect(i*bw,HH-h,Math.max(1,bw-1),h);
    }
    hctx.globalAlpha=1;
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════
//  HISTORY (undo/redo)
// ═══════════════════════════════════════════════════════════
let histStack=[],histIdx=-1,histTimer=null;
function snapshotObj(){
  return {
    effect:state.effect,
    params:JSON.parse(JSON.stringify(state.params)),
    adjust:{...state.adjust}
  };
}
function pushHistory(){
  const snap=JSON.stringify(snapshotObj());
  if(histStack[histIdx]===snap) return;
  histStack=histStack.slice(0,histIdx+1);
  histStack.push(snap);
  if(histStack.length>60) histStack.shift();
  histIdx=histStack.length-1;
  updateHistBtns();
}
function schedHistory(){
  clearTimeout(histTimer);
  histTimer=setTimeout(pushHistory,450);
}
function applySnapshot(snap){
  const o=JSON.parse(snap);
  state.effect=o.effect;
  state.params=o.params;
  state.adjust={...ADJ_DEF,...o.adjust};
  document.querySelectorAll('.eff-tab').forEach(x=>{
    x.classList.toggle('active',x.dataset.eff===state.effect);
  });
  buildControls(state.effect);
  applyAdjust();
}
function undo(){
  if(histIdx>0){histIdx--;applySnapshot(histStack[histIdx]);updateHistBtns();}
}
function redo(){
  if(histIdx<histStack.length-1){histIdx++;applySnapshot(histStack[histIdx]);updateHistBtns();}
}
function updateHistBtns(){
  document.getElementById('undoBtn').style.opacity=histIdx>0?'1':'.35';
  document.getElementById('redoBtn').style.opacity=histIdx<histStack.length-1?'1':'.35';
}
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('redoBtn').addEventListener('click',redo);

// ═══════════════════════════════════════════════════════════
//  CUSTOM SVG SHAPE
// ═══════════════════════════════════════════════════════════
function sanitizeSVG(text){
  const doc=new DOMParser().parseFromString(text,'image/svg+xml');
  const root=doc.documentElement;
  if(root.nodeName.toLowerCase()!=='svg') return null;
  // Strip scripts and event handlers
  doc.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      if(/^on/i.test(a.name)||/javascript:/i.test(a.value)) el.removeAttribute(a.name);
    });
  });
  // viewBox
  let vb=root.getAttribute('viewBox');
  let x=0,y=0,w=100,h=100;
  if(vb){
    const p=vb.trim().split(/[\s,]+/).map(Number);
    if(p.length===4&&p.every(isFinite)){[x,y,w,h]=p;}
  }else{
    const aw=parseFloat(root.getAttribute('width')),ah=parseFloat(root.getAttribute('height'));
    if(isFinite(aw)&&isFinite(ah)){w=aw;h=ah;}
  }
  if(w<=0||h<=0){w=100;h=100;}
  return {inner:root.innerHTML, vb:{x,y,w,h}};
}

function rasterizeStamp(){
  if(!state.customSVG) return;
  const {inner,vb}=state.customSVG;
  const ink=state.params.shapes.inkColor;
  const S=160;
  // Fit viewBox into square, centered; color set for currentColor support
  const mx=Math.max(vb.w,vb.h);
  const vx=vb.x-(mx-vb.w)/2, vy=vb.y-(mx-vb.h)/2;
  const wrapped=`<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="${vx} ${vy} ${mx} ${mx}" color="${ink}">${inner}</svg>`;
  const url=URL.createObjectURL(new Blob([wrapped],{type:'image/svg+xml'}));
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=S;c.height=S;
    c.getContext('2d').drawImage(img,0,0,S,S);
    URL.revokeObjectURL(url);
    gl.bindTexture(gl.TEXTURE_2D,stampTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
    if(state.effect==='shapes'&&state.params.shapes.shape==='custom') render();
  };
  img.onerror=()=>URL.revokeObjectURL(url);
  img.src=url;
}

function loadCustomSVGShape(file){
  const rd=new FileReader();
  rd.onload=()=>{
    const parsed=sanitizeSVG(rd.result);
    if(!parsed){console.error('Invalid SVG');return;}
    state.customSVG=parsed;
    state.params.shapes.shape='custom';
    rasterizeStamp();
    if(state.effect==='shapes') buildControls('shapes');
    render();
    pushHistory();
    toast('toast_svg');
  };
  rd.readAsText(file);
}
document.getElementById('svgShapeInput').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(f) loadCustomSVGShape(f);
  e.target.value='';
});

// ═══════════════════════════════════════════════════════════
//  SVG GENERATORS
// ═══════════════════════════════════════════════════════════
function getImgData(){
  return procCanvas.getContext('2d').getImageData(0,0,procCanvas.width,procCanvas.height);
}
function lumaAt(d,W,H,x,y){
  x=Math.max(0,Math.min(W-1,Math.round(x)));y=Math.max(0,Math.min(H-1,Math.round(y)));
  const i=(y*W+x)*4;return(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
}
function rgbAt(d,W,H,x,y){
  x=Math.max(0,Math.min(W-1,Math.round(x)));y=Math.max(0,Math.min(H-1,Math.round(y)));
  const i=(y*W+x)*4;return[d[i]/255,d[i+1]/255,d[i+2]/255];
}
function mkRot(angDeg){
  const a=angDeg*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
  return{fwd:(x,y)=>[ca*x-sa*y,sa*x+ca*y],inv:(x,y)=>[ca*x+sa*y,-sa*x+ca*y]};
}
function gridBBox(W,H,rot,cs){
  const corners=[[0,H],[W,H],[W,0],[0,0]].map(([x,y])=>rot.fwd(x,y));
  return{
    c0x:Math.floor(Math.min(...corners.map(c=>c[0]))/cs)-1,
    c1x:Math.ceil (Math.max(...corners.map(c=>c[0]))/cs)+1,
    c0y:Math.floor(Math.min(...corners.map(c=>c[1]))/cs)-1,
    c1y:Math.ceil (Math.max(...corners.map(c=>c[1]))/cs)+1,
  };
}
function svgOpen(W,H,paper){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><clipPath id="c0"><rect width="${W}" height="${H}"/></clipPath></defs><rect width="${W}" height="${H}" fill="${paper}"/>`;
}

function svgDots(data,W,H,p){
  const{cellSize:cs,angle,gamma,invert,inkColor,paperColor}=p;
  const rot=mkRot(angle),bb=gridBBox(W,H,rot,cs);
  let circles='';
  for(let cy=bb.c0y;cy<=bb.c1y;cy++)for(let cx=bb.c0x;cx<=bb.c1x;cx++){
    const[rx,ry]=[(cx+.5)*cs,(cy+.5)*cs];
    const[wx,wy]=rot.inv(rx,ry);
    const imgX=wx,imgY=H-wy;
    if(imgX<0||imgX>=W||imgY<0||imgY>=H) continue;
    let l=lumaAt(data,W,H,imgX,imgY);
    if(invert) l=1-l;
    l=Math.pow(Math.max(l,.001),gamma);
    const r=l*cs*.5*.96;if(r<.2) continue;
    circles+=`<circle cx="${imgX.toFixed(2)}" cy="${imgY.toFixed(2)}" r="${r.toFixed(2)}"/>`;
  }
  return svgOpen(W,H,paperColor)+`<g fill="${inkColor}" clip-path="url(#c0)">${circles}</g></svg>`;
}

function svgCMYK(data,W,H,p){
  const{cellSize:cs,dotGain:dg}=p;
  const angles=[p.angC??105,p.angM??75,p.angY??90,p.angK??45],names=['C','M','Y','K'];
  function getCMYK(r,g,b){
    const k=1-Math.max(r,g,b),d=Math.max(1-k,.001);
    return[Math.max(0,Math.min(1,(1-r-k)/d)),Math.max(0,Math.min(1,(1-g-k)/d)),Math.max(0,Math.min(1,(1-b-k)/d)),Math.max(0,Math.min(1,k))];
  }
  return angles.map((deg,ch)=>{
    const rot=mkRot(deg),bb=gridBBox(W,H,rot,cs);
    let circles='';
    for(let cy=bb.c0y;cy<=bb.c1y;cy++)for(let cx=bb.c0x;cx<=bb.c1x;cx++){
      const[rx,ry]=[(cx+.5)*cs,(cy+.5)*cs];
      const[wx,wy]=rot.inv(rx,ry);
      const imgX=wx,imgY=H-wy;
      if(imgX<0||imgX>=W||imgY<0||imgY>=H) continue;
      const[r,g,b]=rgbAt(data,W,H,imgX,imgY);
      let val=getCMYK(r,g,b)[ch];val+=dg*val*(1-val);val=Math.max(0,Math.min(1,val));
      const radius=val*cs*.5*.96;if(radius<.2) continue;
      circles+=`<circle cx="${imgX.toFixed(2)}" cy="${imgY.toFixed(2)}" r="${radius.toFixed(2)}"/>`;
    }
    return{name:names[ch],svg:svgOpen(W,H,'white')+`<g fill="black" clip-path="url(#c0)">${circles}</g></svg>`};
  });
}

function svgLinear(data,W,H,p){
  const{cellSize:cs,angle,angle2,crosshatch,inkColor,paperColor}=p;
  function genStripes(deg){
    const rot=mkRot(deg),bb=gridBBox(W,H,rot,cs);
    let paths='';
    for(let rowI=bb.c0y;rowI<=bb.c1y;rowI++){
      const rowCY=(rowI+.5)*cs;
      const samples=[];
      for(let xi=bb.c0x-1;xi<=bb.c1x+1;xi++){
        const rx=(xi+.5)*cs;
        const[wx,wy]=rot.inv(rx,rowCY);
        samples.push({rx,hw:lumaAt(data,W,H,wx,H-wy)*cs*.5*.96});
      }
      if(samples.every(s=>s.hw<.2)) continue;
      const top=samples.map(s=>{const[wx,wy]=rot.inv(s.rx,rowCY-s.hw);return[wx,H-wy];});
      const bot=samples.slice().reverse().map(s=>{const[wx,wy]=rot.inv(s.rx,rowCY+s.hw);return[wx,H-wy];});
      const pts=[...top,...bot].map(([x,y])=>`${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
      paths+=`<polygon points="${pts}"/>`;
    }
    return paths;
  }
  let content=genStripes(angle);if(crosshatch)content+=genStripes(angle2);
  return svgOpen(W,H,paperColor)+`<g fill="${inkColor}" clip-path="url(#c0)">${content}</g></svg>`;
}

function svgShapes(data,W,H,p){
  const{cellSize:cs,angle,shape,inkColor,paperColor}=p;
  const rot=mkRot(angle),bb=gridBBox(W,H,rot,cs);

  // Custom SVG shape: embed once in defs, instance with <use>
  if(shape==='custom'&&state.customSVG){
    const{inner,vb}=state.customSVG;
    const mx=Math.max(vb.w,vb.h);
    const vcx=vb.x+vb.w/2, vcy=vb.y+vb.h/2;
    let uses='';
    for(let cy=bb.c0y;cy<=bb.c1y;cy++)for(let cx=bb.c0x;cx<=bb.c1x;cx++){
      const[rx,ry]=[(cx+.5)*cs,(cy+.5)*cs];
      const[wx,wy]=rot.inv(rx,ry);
      const svgX=wx,svgY=H-wy;
      if(wx<0||wx>=W||svgY<0||svgY>=H) continue;
      const l=lumaAt(data,W,H,wx,svgY);
      const sc=l*cs*.5*.96;
      if(sc<.3) continue;
      const s=(2*sc/mx).toFixed(4);
      uses+=`<use href="#stamp0" transform="translate(${svgX.toFixed(2)},${svgY.toFixed(2)}) rotate(${angle.toFixed(1)}) scale(${s}) translate(${(-vcx).toFixed(2)},${(-vcy).toFixed(2)})"/>`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><clipPath id="c0"><rect width="${W}" height="${H}"/></clipPath><g id="stamp0">${inner}</g></defs><rect width="${W}" height="${H}" fill="${paperColor}"/><g color="${inkColor}" clip-path="url(#c0)">${uses}</g></svg>`;
  }

  function shapeEl(cx,cy,sc,shape){
    if(sc<.3) return'';
    const tr=`translate(${cx.toFixed(2)},${cy.toFixed(2)}) rotate(${angle.toFixed(1)})`;
    if(shape==='hex'){
      const pts=Array.from({length:6},(_,i)=>{const a=(i*60-30)*Math.PI/180;return`${(sc*Math.cos(a)).toFixed(2)},${(sc*Math.sin(a)).toFixed(2)}`;}).join(' ');
      return`<polygon points="${pts}" transform="${tr}"/>`;
    }else if(shape==='cross'){
      const w=sc*.38,h=sc;
      return`<path d="M${-h},${-w} L${-w},${-w} L${-w},${-h} L${w},${-h} L${w},${-w} L${h},${-w} L${h},${w} L${w},${w} L${w},${h} L${-w},${h} L${-w},${w} L${-h},${w} Z" transform="${tr}"/>`;
    }else if(shape==='diamond'){
      return`<polygon points="0,${-sc} ${sc},0 0,${sc} ${-sc},0" transform="${tr}"/>`;
    }else if(shape==='star'){
      const pts=Array.from({length:10},(_,i)=>{const a=(i*36-90)*Math.PI/180;const r=i%2===0?sc:sc*.4;return`${(r*Math.cos(a)).toFixed(2)},${(r*Math.sin(a)).toFixed(2)}`;}).join(' ');
      return`<polygon points="${pts}" transform="${tr}"/>`;
    }else if(shape==='square'){
      return`<rect x="${-sc}" y="${-sc}" width="${2*sc}" height="${2*sc}" transform="${tr}"/>`;
    }else if(shape==='triangle'){
      const pts=[[-90,sc],[30,sc],[150,sc]].map(([deg,r])=>{
        const a=deg*Math.PI/180;return`${(r*Math.cos(a)).toFixed(2)},${(r*Math.sin(a)).toFixed(2)}`;
      }).join(' ');
      return`<polygon points="${pts}" transform="${tr}"/>`;
    }else{
      return`<circle r="${(sc*.7).toFixed(2)}" fill="none" stroke="${inkColor}" stroke-width="${(sc*.6).toFixed(2)}" transform="${tr}"/>`;
    }
  }
  let els='';
  for(let cy=bb.c0y;cy<=bb.c1y;cy++)for(let cx=bb.c0x;cx<=bb.c1x;cx++){
    const[rx,ry]=[(cx+.5)*cs,(cy+.5)*cs];
    const[wx,wy]=rot.inv(rx,ry);
    const svgX=wx,svgY=H-wy;
    if(wx<0||wx>=W||svgY<0||svgY>=H) continue;
    const l=lumaAt(data,W,H,wx,svgY);
    els+=shapeEl(svgX,svgY,l*cs*.5*.96,shape);
  }
  return svgOpen(W,H,paperColor)+`<g fill="${inkColor}" clip-path="url(#c0)">${els}</g></svg>`;
}

function svgRiso(data,W,H,p){
  const{cellSize:cs,numColors,color1,color2,color3,misreg}=p;
  const angles=[45,75,15],colors=[color1,color2,color3];
  const invLayer=[false,true,false];
  const offsets=[[misreg*.7,misreg*.4],[-misreg*.5,misreg*.6],[misreg*.3,-misreg*.7]];
  const nL=Math.round(numColors);
  let layers='';
  for(let li=0;li<nL;li++){
    const rot=mkRot(angles[li]),bb=gridBBox(W,H,rot,cs);
    const[ox,oy]=offsets[li];
    let circles='';
    for(let cy=bb.c0y;cy<=bb.c1y;cy++)for(let cx=bb.c0x;cx<=bb.c1x;cx++){
      const[rx,ry]=[(cx+.5)*cs,(cy+.5)*cs];
      const[wx,wy]=rot.inv(rx,ry);
      const imgX=wx+ox,imgY=H-wy+oy;
      if(imgX<0||imgX>=W||imgY<0||imgY>=H) continue;
      let l=lumaAt(data,W,H,imgX,imgY);if(invLayer[li]) l=1-l;
      const r=l*cs*.5*.96;if(r<.2) continue;
      circles+=`<circle cx="${imgX.toFixed(2)}" cy="${imgY.toFixed(2)}" r="${r.toFixed(2)}"/>`;
    }
    layers+=`<g fill="${colors[li]}">${circles}</g>`;
  }
  return svgOpen(W,H,'white')+`<g clip-path="url(#c0)" style="mix-blend-mode:multiply">${layers}</g></svg>`;
}

// Bayer functions — identical formulas to GLSL
const frac=x=>x-Math.floor(x);
function B2(x,y){x=Math.floor(x);y=Math.floor(y);return frac(x/2+y*y*.75);}
function B4(x,y){return B2(x/2,y/2)*.25+B2(x,y);}
function B8(x,y){return B4(x/2,y/2)*.25+B2(x,y);}

function svgDither(data,W,H,p){
  const{pixelSize:px,matrix,bias,invert,inkColor,paperColor}=p;
  const bayer=matrix<=2?B2:(matrix<=4?B4:B8);
  const cols=Math.ceil(W/px),rows=Math.ceil(H/px);
  let rects='';
  for(let cy=0;cy<rows;cy++){
    let runStart=-1;
    for(let cx=0;cx<=cols;cx++){
      let isInk=false;
      if(cx<cols){
        let l=lumaAt(data,W,H,cx*px+px/2,cy*px+px/2);
        if(invert) l=1-l;
        isInk=l<bayer(cx,cy)+bias;
      }
      if(isInk&&runStart<0) runStart=cx;
      else if(!isInk&&runStart>=0){
        rects+=`<rect x="${runStart*px}" y="${cy*px}" width="${(cx-runStart)*px}" height="${px}"/>`;
        runStart=-1;
      }
    }
  }
  return svgOpen(W,H,paperColor)+`<g fill="${inkColor}" clip-path="url(#c0)">${rects}</g></svg>`;
}

function generateCurrentSVG(){
  const d=getImgData(),p=state.params[state.effect],W=canvas.width,H=canvas.height;
  if(state.effect==='dots')   return svgDots(d.data,W,H,p);
  if(state.effect==='cmyk')   return svgCMYK(d.data,W,H,p)[0].svg;
  if(state.effect==='linear') return svgLinear(d.data,W,H,p);
  if(state.effect==='shapes') return svgShapes(d.data,W,H,p);
  if(state.effect==='riso')   return svgRiso(d.data,W,H,p);
  if(state.effect==='dither') return svgDither(d.data,W,H,p);
  return'';
}

// ═══════════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════════
function dlFile(content,name,type){
  const b=new Blob([content],{type});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  URL.revokeObjectURL(a.href);
}
function showSpinner(v){document.getElementById('spinner').classList.toggle('on',v);}

function exportPNG(){
  if(!state.imageLoaded) return;
  canvas.toBlob(blob=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='halftoner.png';a.click();URL.revokeObjectURL(a.href);
  },'image/png');
}

function exportPNGHD(scale){
  if(!state.imageLoaded) return;
  showSpinner(true);
  setTimeout(()=>{
    try{
      const svg=generateCurrentSVG();
      const W=canvas.width*scale,H=canvas.height*scale;
      const blob=new Blob([svg],{type:'image/svg+xml'});
      const url=URL.createObjectURL(blob);
      const img=new Image();
      img.onload=()=>{
        const out=document.createElement('canvas');
        out.width=W;out.height=H;
        const ctx=out.getContext('2d');
        ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,W,H);
        URL.revokeObjectURL(url);
        out.toBlob(b=>{
          const a=document.createElement('a');a.href=URL.createObjectURL(b);
          a.download=`halftoner_${scale}x.png`;a.click();URL.revokeObjectURL(a.href);
          showSpinner(false);
        },'image/png');
      };
      img.onerror=()=>showSpinner(false);
      img.src=url;
    }catch(e){console.error(e);showSpinner(false);}
  },10);
}

function exportSVG(){
  if(!state.imageLoaded) return;
  showSpinner(true);
  setTimeout(()=>{
    try{dlFile(generateCurrentSVG(),'halftoner.svg','image/svg+xml');}
    finally{showSpinner(false);}
  },10);
}
function exportCMYK(){
  if(!state.imageLoaded) return;
  showSpinner(true);
  setTimeout(()=>{
    try{
      const d=getImgData(),p=state.params.cmyk,W=canvas.width,H=canvas.height;
      svgCMYK(d.data,W,H,p).forEach((l,i)=>{
        setTimeout(()=>dlFile(l.svg,`halftoner_${l.name}.svg`,'image/svg+xml'),i*200);
      });
    }finally{showSpinner(false);}
  },10);
}

async function copyPNG(){
  if(!state.imageLoaded) return;
  try{
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    toast('toast_copied');
  }catch(e){console.error(e);}
}

// URL share: encode snapshot into hash
function encodeStateURL(){
  const o=snapshotObj();
  const compact={e:o.effect,p:o.params[o.effect],a:o.adjust};
  return location.origin+location.pathname+'#s='+btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
}
async function copyLink(){
  try{
    await navigator.clipboard.writeText(encodeStateURL());
    toast('toast_link');
  }catch(e){console.error(e);}
}
function loadStateURL(){
  if(!location.hash.startsWith('#s=')) return;
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
    if(o.e&&progs[o.e]){
      state.effect=o.e;
      if(o.p) Object.assign(state.params[o.e],o.p);
      if(o.a) state.adjust={...ADJ_DEF,...o.a};
      if(state.params.shapes.shape==='custom'&&!state.customSVG) state.params.shapes.shape='hex';
      document.querySelectorAll('.eff-tab').forEach(x=>{
        x.classList.toggle('active',x.dataset.eff===o.e);
      });
    }
  }catch(e){console.warn('Invalid state URL');}
}

// ═══════════════════════════════════════════════════════════
//  ZOOM / PAN / FULLSCREEN
// ═══════════════════════════════════════════════════════════
function applyTransform(){
  canvas.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
  document.getElementById('zoom-hud').textContent=Math.round(state.zoom*100)+'%';
}
function fitView(){state.zoom=1;state.panX=0;state.panY=0;applyTransform();}

const ca=document.getElementById('canvas-area');
ca.addEventListener('wheel',e=>{
  if(!state.imageLoaded) return;
  e.preventDefault();
  const dir=e.deltaY<0?1.12:1/1.12;
  state.zoom=Math.min(8,Math.max(.15,state.zoom*dir));
  applyTransform();
},{passive:false});

let panning=false,panStart=null;
ca.addEventListener('mousedown',e=>{
  if(!state.imageLoaded||e.button!==0) return;
  panning=true;ca.classList.add('panning');
  panStart={x:e.clientX-state.panX,y:e.clientY-state.panY};
});
window.addEventListener('mouseup',()=>{panning=false;ca.classList.remove('panning');});
window.addEventListener('mousemove',e=>{
  if(panning&&panStart){
    state.panX=e.clientX-panStart.x;
    state.panY=e.clientY-panStart.y;
    applyTransform();
  }
});
ca.addEventListener('dblclick',fitView);
document.getElementById('fitBtn').addEventListener('click',fitView);
document.getElementById('fsBtn').addEventListener('click',()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

// ═══════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════
function handleFile(file){
  if(!file) return;
  if(file.type.startsWith('video/')){loadVideo(file);pushHistory();return;}
  if(!file.type.startsWith('image/')) return;
  const img=new Image();
  img.onload=()=>{loadImage(img);pushHistory();};
  img.src=URL.createObjectURL(file);
}
document.getElementById('uploadBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('dropClick').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('dropCam').addEventListener('click',toggleWebcam);
document.getElementById('fileInput').addEventListener('change',e=>handleFile(e.target.files[0]));
document.getElementById('webcamBtn').addEventListener('click',toggleWebcam);

ca.addEventListener('dragover',e=>{e.preventDefault();ca.classList.add('drag-over');});
ca.addEventListener('dragleave',()=>ca.classList.remove('drag-over'));
ca.addEventListener('drop',e=>{e.preventDefault();ca.classList.remove('drag-over');handleFile(e.dataTransfer.files[0]);});

document.querySelectorAll('.eff-tab').forEach(tb=>{
  tb.addEventListener('click',()=>{
    document.querySelectorAll('.eff-tab').forEach(x=>x.classList.remove('active'));
    tb.classList.add('active');
    state.effect=tb.dataset.eff;
    buildControls(state.effect);render();pushHistory();
  });
});

const splitLine=document.getElementById('split-line');
document.getElementById('splitBtn').addEventListener('click',toggleSplit);
function toggleSplit(){
  state.splitActive=!state.splitActive;
  document.getElementById('splitBtn').classList.toggle('active',state.splitActive);
  splitLine.style.display=state.splitActive?'block':'none';
  if(!state.splitActive){state.splitX=-1;render();}
}
canvas.addEventListener('mousemove',e=>{
  if(!state.splitActive||!state.imageLoaded) return;
  const rect=canvas.getBoundingClientRect();
  state.splitX=(e.clientX-rect.left)*(canvas.width/rect.width);
  const caRect=ca.getBoundingClientRect();
  splitLine.style.left=(e.clientX-caRect.left)+'px';
  if(!liveActive&&!videoMode) render();
});

document.getElementById('autoBtn').addEventListener('click',autoAnalyze);
document.getElementById('randBtn').addEventListener('click',randomize);

document.getElementById('expBtn').addEventListener('click',e=>{
  e.stopPropagation();document.getElementById('expMenu').classList.toggle('open');
});
document.addEventListener('click',()=>document.getElementById('expMenu').classList.remove('open'));
document.querySelectorAll('.exp-item').forEach(item=>{
  item.addEventListener('click',e=>{
    e.stopPropagation();document.getElementById('expMenu').classList.remove('open');
    const act=item.dataset.act;
    if(act==='png') exportPNG();
    else if(act==='png2') exportPNGHD(2);
    else if(act==='png4') exportPNGHD(4);
    else if(act==='svg') exportSVG();
    else if(act==='cmyk') exportCMYK();
    else if(act==='copy') copyPNG();
    else if(act==='link') copyLink();
  });
});

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{currentLang=btn.dataset.lang;applyLang();});
});

const EFF_KEYS={'1':'dots','2':'cmyk','3':'linear','4':'shapes','5':'riso','6':'dither'};
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return;}
  if(e.ctrlKey||e.metaKey) return;
  if(EFF_KEYS[k]){
    state.effect=EFF_KEYS[k];
    document.querySelectorAll('.eff-tab').forEach(x=>{
      x.classList.toggle('active',x.dataset.eff===state.effect);
    });
    buildControls(state.effect);render();pushHistory();
  }
  else if(k==='s') toggleSplit();
  else if(k==='f'||k==='0') fitView();
  else if(k==='e') exportPNG();
  else if(k==='a') autoAnalyze();
  else if(k==='r') randomize();
  else if(k===' '&&videoMode){e.preventDefault();toggleVideoPlay();}
});

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
canvas.width=800;canvas.height=600;
loadStateURL();
applyLang();
pushHistory();
</script>
</body>
</html>
